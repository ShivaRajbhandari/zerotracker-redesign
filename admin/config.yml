# Editor settings for the Net Zero Tracker prototype (Decap CMS).
# Content lives in the PRIVATE repo below; approved changes are published to this site by its GitHub Action.
backend:
  name: github
  repo: ShivaRajbhandari/zerotracker-source
  branch: main
  base_url: https://babevote-login.shiva-a-rajbhandari.workers.dev   # shared GitHub login helper for www.shivarajbhandari.com (repo scope)
  auth_endpoint: auth
  auth_scope: repo
  commit_messages:
    create: "Add {{collection}} “{{slug}}”"
    update: "Update {{collection}} “{{slug}}”"
    delete: "Delete {{collection}} “{{slug}}”"
local_backend: true   # only used when the editor is opened on localhost (testing)
publish_mode: editorial_workflow
media_folder: content/uploads
public_folder: /uploads
site_url: https://www.shivarajbhandari.com/zerotracker-redesign/
display_url: https://www.shivarajbhandari.com/zerotracker-redesign/
locale: en

collections:
  - name: pages
    label: Page text
    label_singular: Page
    description: "Every piece of wording on the site, page by page. Open a page, expand a piece of text and change it. The preview on the right is the real page, and you can switch it to tablet or phone size."
    editor: {preview: true}
    files:
      - label: "Site-wide: menu, banner, footer, newsletter box"
        name: "site"
        file: "content/text/site.json"
        fields:
          - {name: title, widget: hidden}
          - {name: route, widget: hidden}
          - label: "Text on this page (30 pieces, in page order)"
            name: blocks
            widget: list
            allow_add: false
            collapsed: true
            summary: "{{fields.where}}: {{fields.text}}"
            fields:
              - {name: where, widget: hidden}
              - {name: orig, widget: hidden}
              - {name: start, widget: hidden}
              - {label: Text, name: text, widget: text, hint: "Formatting: `**bold**`, `*italic*`, `[link text](https://…)`. Press Enter for a line break. Counts and years that come from the data are best left alone."}
