  - name: records
    label: Data entries
    label_singular: Data entry
    description: "Add a new country, region, city or company, or change or remove an existing one. Start from an existing entry to edit it."
    folder: content/records
    extension: json
    format: json
    create: true
    slug: "{{slug}}"
    identifier_field: title
    summary: "{{title}}"
    fields:
      - {label: "What this change is (for the review list), e.g. Update Brazil's target year", name: title, widget: string}
      - {label: "Remove this entry from the site", name: remove, widget: boolean, default: false, required: false}
      - {label: Entry, name: record, widget: nzt-record}

  - name: imports
    label: Data uploads (CSV)
    label_singular: Data upload
    description: "Upload a spreadsheet (CSV) to add or update many entries at once. Rows are matched to existing entries by their ID, or by name and type; anything else is added as new."
    folder: content/imports
    extension: json
    format: json
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    identifier_field: title
    summary: "{{title}}"
    fields:
      - {label: "Name for this upload, e.g. November 2026 data refresh", name: title, widget: string}
      - {label: Notes for reviewers, name: notes, widget: text, required: false}
      - {label: Spreadsheet, name: upload, widget: nzt-csv}
